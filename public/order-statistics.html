<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Statistics - Noriks Call Center</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #F0F2F5; }
        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; transition: margin-left var(--transition-slow); }
        .sidebar.collapsed ~ .main-content { margin-left: 70px; }
        @media (max-width: 1024px) { .main-content { margin-left: 0; } }
        .pg { padding: 74px 16px 30px; }

        .section-title { font-size:18px; font-weight:700; color:#1A1A2E; margin:24px 0 12px; display:flex; align-items:center; gap:8px; }
        .section-title:first-child { margin-top:0; }
        .section-title i { font-size:16px; }

        .day-card { background:#fff; border:1px solid #E8E8EC; border-radius:6px; box-shadow:0 1px 2px rgba(0,0,0,0.03); margin-bottom:6px; overflow:hidden; }
        .day-header { padding:5px 12px; border-bottom:1px solid #E8E8EC; display:flex; align-items:center; justify-content:space-between; }
        .day-date { font-size:12px; font-weight:700; color:#1A1A2E; }
        .day-weekday { font-size:11px; color:#9CA3AF; margin-left:6px; font-weight:400; }
        .day-summary { font-size:11px; color:#6B7280; }
        .day-summary b { color:#1A1A2E; }

        .day-tbl { width:100%; border-collapse:collapse; }
        .day-tbl th { padding:3px 8px; text-align:center; background:#F9FAFB; border-bottom:2px solid #E5E7EB; font-size:9px; font-weight:600; color:#6B7280; text-transform:uppercase; letter-spacing:.3px; white-space:nowrap; }
        .day-tbl th:first-child { text-align:left; }
        .day-tbl td { padding:3px 8px; border-bottom:1px solid #F3F4F6; font-size:11px; color:#374151; text-align:center; }
        .day-tbl td:first-child { text-align:left; }
        .day-tbl tr:last-child td { border-bottom:none; }
        .day-tbl tr:hover td { background:#F9FAFB; }
        .country-cell { font-weight:600; white-space:nowrap; }
        .v-called { font-weight:700; color:#1A1A2E; }
        .v-new { color:#D97706; font-weight:600; }
        .v-total { color:#6B7280; }
        .v-notcalled { color:#EF4444; font-weight:600; }
        .v-monthcalled { color:#10B981; font-weight:600; }
        .v-zero { color:#D1D5DB; }
        .v-prev { color:#8B5CF6; font-weight:600; }
        .type-ab { display:inline-block; padding:1px 6px; border-radius:4px; font-size:9px; font-weight:600; background:#FEF3C7; color:#D97706; }
        .type-ot { display:inline-block; padding:1px 6px; border-radius:4px; font-size:9px; font-weight:600; background:#EDE9FE; color:#7C3AED; }
        .type-pd { display:inline-block; padding:1px 6px; border-radius:4px; font-size:9px; font-weight:600; background:#DBEAFE; color:#2563EB; }
        .v-ab { color:#D97706; font-weight:600; }
        .v-ot { color:#7C3AED; font-weight:600; }
        .v-prevtotal { color:#6B7280; }

        .pills { display:inline-flex; background:#fff; border:1px solid #E0E0E5; border-radius:8px; padding:4px; gap:2px; flex-wrap:wrap; }
        .pill { padding:6px 14px; border-radius:6px; border:1px solid transparent; background:transparent; color:#6B7280; font-size:12px; font-weight:500; cursor:pointer; transition:all .15s; }
        .pill:hover { color:#1A1A2E; }
        .pill.on { background:#fff; color:#1A1A2E; font-weight:600; border-color:#D1D5DB; box-shadow:0 1px 2px rgba(0,0,0,0.06); }

        .loading { text-align:center; padding:60px; color:#9CA3AF; font-size:13px; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .spinner { display:inline-block; width:28px; height:28px; border:3px solid #E8E8EC; border-top-color:#2563EB; border-radius:50%; animation:spin .8s linear infinite; margin-bottom:8px; }
    
.month-orders-card{margin-top:24px;background:#fff;border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.month-orders-header{padding:14px 16px;border-bottom:1px solid #E5E7EB;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,#F0FDF4,#fff);}
.month-orders-title{font-size:14px;font-weight:700;color:#065F46;display:flex;align-items:center;gap:8px;}
.month-orders-meta{font-size:12px;color:#6B7280;}
.month-orders-search{padding:6px 10px;border:1px solid #D1D5DB;border-radius:6px;font-size:12px;outline:none;min-width:220px;}
.month-orders-tbl{width:100%;border-collapse:collapse;font-size:12px;}
.month-orders-tbl thead th{background:#F9FAFB;color:#374151;font-weight:600;padding:8px 10px;text-align:left;border-bottom:1px solid #E5E7EB;font-size:11px;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0;}
.month-orders-tbl tbody td{padding:8px 10px;border-bottom:1px solid #F3F4F6;vertical-align:top;}
.month-orders-tbl tbody tr:hover{background:#F9FAFB;}
.mo-orderid{font-weight:700;color:#10B981;}
.mo-total{font-weight:700;color:#111827;white-space:nowrap;}
.mo-products{max-width:340px;color:#4B5563;font-size:11px;}
.mo-agent{font-weight:600;color:#2563EB;}
.mo-date{color:#6B7280;font-size:11px;white-space:nowrap;}
.mo-status{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;text-transform:uppercase;}
.mo-status.processing{background:#DBEAFE;color:#1D4ED8;}
.mo-status.completed{background:#D1FAE5;color:#065F46;}
.mo-status.cancelled{background:#FEE2E2;color:#991B1B;}
.mo-status.on-hold{background:#FEF3C7;color:#92400E;}
.mo-status.pending{background:#E5E7EB;color:#374151;}
.mo-loading{padding:24px;text-align:center;color:#6B7280;font-size:13px;}
</style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">N</div>
            <div class="brand">Noriks<span>Call Center</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-title">Menu</div>
                <a href="/#leads" class="nav-item" data-tab="leads"><i class="fas fa-users"></i><span>Leads</span></a>
                <a href="/statistics" class="nav-item"><i class="fas fa-shopping-cart"></i><span>Abandoned Statistics</span></a>
                <a href="/onetime-statistics" class="nav-item"><i class="fas fa-user-tag"></i><span>One-Time Statistics</span></a>
                <a href="/order-statistics" class="nav-item active"><i class="fas fa-receipt"></i><span>Order Statistics</span></a>
            </div>
            <div class="nav-section admin-only" id="messagingSection">
                <div class="nav-title">Messaging</div>
                <a href="/#sms-automation" class="nav-item" data-tab="sms-automation"><i class="fas fa-robot"></i><span>SMS Automation</span></a>
                <a href="/#sms-dashboard" class="nav-item" data-tab="sms-dashboard"><i class="fas fa-comment-sms"></i><span>SMS Dashboard</span><span class="badge" id="navSms">0</span></a>
                <a href="/#sms-settings" class="nav-item" data-tab="sms-settings"><i class="fas fa-cog"></i><span>SMS Settings</span></a>
                <a href="/#buyers-settings" class="nav-item" data-tab="buyers-settings"><i class="fas fa-user-cog"></i><span>Options</span></a>
            </div>
            <div class="nav-section admin-only" id="adminSection">
                <div class="nav-title">Admin</div>
                <a href="/#agents" class="nav-item" data-tab="agents"><i class="fas fa-users-cog"></i><span>Agents</span></a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" onclick="toggleSidebarCollapse()" title="Collapse"><i class="fas fa-chevron-left"></i><span>Skrij meni</span></button>
            <div class="user-card">
                <div class="user-avatar" id="userAvatar">N</div>
                <div class="user-info"><div class="user-name" id="userName">Noriks</div><div class="user-role" id="userRole">Admin</div></div>
                <button class="logout-btn" onclick="logout()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </aside>

    <div class="top-bar" id="topBar">
        <button class="menu-btn" id="menuToggle"><i class="fas fa-bars"></i></button>
        <div class="page-title">Order Statistics</div>
        <div class="top-bar-actions">
            <button onclick="loadStats()" style="background:#2563EB;color:#fff;border:none;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:Inter,sans-serif;"><i class="fas fa-sync-alt"></i> Refresh</button>
            <div class="header-avatar" id="headerAvatar">N</div>
        </div>
    </div>

    <main class="main-content">
        <div class="pg">
            <div class="pills" id="monthPills"></div>
            <div style="height:12px"></div>
            <div id="statsContent">
                <div class="loading"><div class="spinner"></div><div>Loading statistics...</div></div>
            </div>
        </div>
    </main>

<script>
var user = JSON.parse(localStorage.getItem("callcenter_user") || "null");
if (!user) window.location.href = "/login";
else {
    document.getElementById("userName").textContent = user.username;
    document.getElementById("userRole").textContent = user.role === "admin" ? "Admin" : "Agent";
    document.getElementById("userAvatar").textContent = user.username[0].toUpperCase();
    document.getElementById("headerAvatar").textContent = user.username[0].toUpperCase();
}
document.getElementById("menuToggle").addEventListener("click", function() { document.getElementById("sidebar").classList.toggle("open"); document.getElementById("sidebarOverlay").classList.toggle("active"); });
document.getElementById("sidebarOverlay").addEventListener("click", function() { document.getElementById("sidebar").classList.remove("open"); document.getElementById("sidebarOverlay").classList.remove("active"); });
function logout() { localStorage.removeItem("callcenter_user"); window.location.href = "/login"; }
if (user && user.role === "admin") document.body.classList.add("is-admin");
function toggleSidebarCollapse() {
    var sb = document.getElementById("sidebar");
    var collapsed = sb.classList.toggle("collapsed");
    localStorage.setItem("sidebar_collapsed", collapsed ? "true" : "false");
}
if (localStorage.getItem("sidebar_collapsed") === "true") document.getElementById("sidebar").classList.add("collapsed");

var flags = { hr:"\u{1F1ED}\u{1F1F7}", cz:"\u{1F1E8}\u{1F1FF}", pl:"\u{1F1F5}\u{1F1F1}", gr:"\u{1F1EC}\u{1F1F7}", sk:"\u{1F1F8}\u{1F1F0}", it:"\u{1F1EE}\u{1F1F9}", si:"\u{1F1F8}\u{1F1EE}", hu:"\u{1F1ED}\u{1F1FA}" };
var dateFrom, dateTo;

(function() {
    var now = new Date(), h = "";
    var cm = now.getMonth();
    for (var i = 4; i <= 11; i++) {
        var d = new Date(2026, i, 1);
        var lbl = d.toLocaleString("en", { month:"short" }) + " " + d.getFullYear();
        var isFuture = i > cm;
        h += '<button class="pill' + (i === cm ? " on" : "") + '"' + (isFuture ? ' disabled style="opacity:0.3;cursor:default;"' : '') + ' data-m="'+i+'">' + lbl + '</button>';
    }
    document.getElementById("monthPills").innerHTML = h;
    dateFrom = 2026 + "-" + String(cm+1).padStart(2,"0") + "-01";
    dateTo = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" + String(now.getDate()).padStart(2,"0");
    document.querySelectorAll(".pill").forEach(function(p) {
        p.addEventListener("click", function() {
            document.querySelectorAll(".pill").forEach(function(x){x.classList.remove("on");});
            p.classList.add("on");
            var m = parseInt(p.dataset.m);
            dateFrom = 2026 + "-" + String(m+1).padStart(2,"0") + "-01";
            var now2 = new Date();
            var lastDay = new Date(2026, m+1, 0).getDate();
            var endD = lastDay;
            if (2026 === now2.getFullYear() && m === now2.getMonth()) endD = now2.getDate();
            dateTo = 2026 + "-" + String(m+1).padStart(2,"0") + "-" + String(endD).padStart(2,"0");
            loadStats();
        });
    });
})();

function loadStats() {
    document.getElementById("statsContent").innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading statistics...</div></div>';
    fetch("/api/order-statistics?from=" + dateFrom + "&to=" + dateTo)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (!data.success) { document.getElementById("statsContent").innerHTML = '<div class="loading">Error: ' + (data.error||"unknown") + '</div>'; return; }
            render(data);
        })
        .catch(function(e) { document.getElementById("statsContent").innerHTML = '<div class="loading">Error: ' + e.message + '</div>'; });
}

function fv(val, cls) { return val === 0 ? '<span class="v-zero">0</span>' : '<span class="' + cls + '">' + val + '</span>'; }

function renderDayCards(days, countries) {
    var h = "";
    for (var d = 0; d < days.length; d++) {
        var row = days[d];
        var dt = new Date(row.date + "T12:00:00");
        var weekday = dt.toLocaleString("en", { weekday:"short" });
        var dateLabel = row.date.slice(8,10) + "." + row.date.slice(5,7) + ".";
        var tot = row.total || {};

        h += '<div class="day-card">';
        h += '<div class="day-header">';
        h += '<div><span class="day-date">' + dateLabel + '</span><span class="day-weekday">' + weekday + '</span></div>';
        h += '<div class="day-summary"><b>' + (tot.total||0) + '</b> orders &middot; <span class="v-ab">' + (tot.abandoned||0) + ' aband.</span> &middot; <span class="v-ot">' + (tot.onetime||0) + ' one-time</span></div>';
        h += '</div>';
        h += '<table class="day-tbl"><thead><tr><th></th><th>Total</th><th>\u{1F6D2} Abandoned</th><th>\u{1F464} One-time</th></tr></thead><tbody>';

        for (var c = 0; c < countries.length; c++) {
            var cc = countries[c];
            var cell = row[cc];
            if (!cell) continue;
            h += '<tr>';
            h += '<td class="country-cell">' + flags[cc] + ' ' + cc.toUpperCase() + '</td>';
            h += '<td>' + fv(cell.total||0, 'v-called') + '</td>';
            h += '<td>' + fv(cell.abandoned||0, 'v-ab') + '</td>';
            h += '<td>' + fv(cell.onetime||0, 'v-ot') + '</td>';
            h += '</tr>';
        }
        h += '</tbody></table>';

        // Order list
        var ords = row.orders || [];
        if (ords.length > 0) {
            h += '<table class="day-tbl" style="border-top:1px solid #E5E7EB;"><thead><tr><th>Order</th><th>Country</th><th>Type</th><th>Agent</th></tr></thead><tbody>';
            for (var i = 0; i < ords.length; i++) {
                var o = ords[i];
                var tc = o.type === 'onetime' ? 'ot' : (o.type === 'pending' ? 'pd' : 'ab');
                var tl = o.type === 'onetime' ? 'ONE-TIME' : (o.type === 'pending' ? 'PENDING' : 'ABANDONED');
                h += '<tr>';
                h += '<td style="font-weight:600;color:#10B981;">#' + (o.orderId||'-') + '</td>';
                h += '<td>' + (o.flag||'') + ' ' + (o.country||'').toUpperCase() + '</td>';
                h += '<td><span class="type-' + tc + '">' + tl + '</span></td>';
                h += '<td style="font-weight:500;">' + (o.agent||'-') + '</td>';
                h += '</tr>';
            }
            h += '</tbody></table>';
        }

        h += '</div>';
    }
    return h;
}

function renderSummary(data, countries) {
    var s = data.monthSummary;
    var t = s.totals;
    var h = '<div class="day-card" style="border:2px solid #2563EB;background:linear-gradient(135deg,#EFF6FF,#fff);">';
    h += '<div class="day-header" style="border-bottom:2px solid #DBEAFE;">';
    h += '<div><span class="day-date" style="font-size:15px;">\u{1F4CA} Month Total</span></div>';
    h += '<div class="day-summary"><b>' + t.total + '</b> orders &middot; <span class="v-ab">' + t.abandoned + ' aband.</span> &middot; <span class="v-ot">' + t.onetime + ' one-time</span></div>';
    h += '</div>';

    // Country breakdown
    h += '<table class="day-tbl"><thead><tr><th></th><th>Total</th><th>\u{1F6D2} Abandoned</th><th>\u{1F464} One-time</th></tr></thead><tbody>';
    for (var c = 0; c < countries.length; c++) {
        var cc = countries[c];
        var cs = s.countries[cc] || {};
        if ((cs.total||0) === 0) continue;
        h += '<tr>';
        h += '<td class="country-cell">' + flags[cc] + ' ' + cc.toUpperCase() + '</td>';
        h += '<td>' + fv(cs.total||0, 'v-called') + '</td>';
        h += '<td>' + fv(cs.abandoned||0, 'v-ab') + '</td>';
        h += '<td>' + fv(cs.onetime||0, 'v-ot') + '</td>';
        h += '</tr>';
    }
    h += '</tbody></table>';

    // Agent breakdown
    var agents = s.agents || {};
    var agentKeys = Object.keys(agents).sort(function(a,b) { return (agents[b].total||0) - (agents[a].total||0); });
    if (agentKeys.length > 0) {
        h += '<div style="border-top:2px solid #DBEAFE;padding:6px 12px;font-size:11px;font-weight:600;color:#6B7280;">AGENTS</div>';
        h += '<table class="day-tbl"><thead><tr><th>Agent</th><th>Total</th><th>\u{1F6D2} Abandoned</th><th>\u{1F464} One-time</th></tr></thead><tbody>';
        for (var a = 0; a < agentKeys.length; a++) {
            var ag = agentKeys[a];
            var ad = agents[ag];
            h += '<tr>';
            h += '<td style="font-weight:600;">' + ag + '</td>';
            h += '<td>' + fv(ad.total||0, 'v-called') + '</td>';
            h += '<td>' + fv(ad.abandoned||0, 'v-ab') + '</td>';
            h += '<td>' + fv(ad.onetime||0, 'v-ot') + '</td>';
            h += '</tr>';
        }
        h += '</tbody></table>';
    }

    h += '</div>';
    return h;
}

function render(data) {
    var h = '';
    h += '<div class="section-title"><i class="fas fa-receipt" style="color:#10B981;"></i> Orders</div>';
    h += renderSummary(data, data.countries);
    h += renderDayCards(data.days, data.countries);
    h += '<div id="monthOrdersWrap"><div class="month-orders-card"><div class="mo-loading"><i class="fas fa-spinner fa-spin"></i> Loading month orders…</div></div></div>';
    document.getElementById("statsContent").innerHTML = h;
    loadMonthOrders();
}

var _monthOrdersData = [];
var _monthOrdersLastSync = null;

function loadMonthOrders() {
    fetch('/api/order-statistics/month-orders?from=' + dateFrom + '&to=' + dateTo)
        .then(function(r){ return r.json(); })
        .then(function(d){
            if (!d.success) { document.getElementById('monthOrdersWrap').innerHTML = '<div class="month-orders-card"><div class="mo-loading">Error: ' + (d.error||'unknown') + '</div></div>'; return; }
            _monthOrdersData = d.orders || [];
            _monthOrdersLastSync = d.lastSync || null;
            renderMonthOrders('');
        })
        .catch(function(e){ document.getElementById('monthOrdersWrap').innerHTML = '<div class="month-orders-card"><div class="mo-loading">Error: ' + e.message + '</div></div>'; });
}

function renderMonthOrders(filter) {
    var f = (filter||'').toLowerCase().trim();
    var rows = _monthOrdersData.filter(function(o){
        if (!f) return true;
        return (o.customer||'').toLowerCase().indexOf(f) >= 0
            || (o.products||'').toLowerCase().indexOf(f) >= 0
            || (o.agent||'').toLowerCase().indexOf(f) >= 0
            || (o.storeCode||'').toLowerCase().indexOf(f) >= 0
            || String(o.number||'').indexOf(f) >= 0;
    });
    var symMap = {EUR:'€', CZK:'Kč', PLN:'zł', HUF:'Ft'};
    var sumTotal = {};
    rows.forEach(function(o){ sumTotal[o.currency] = (sumTotal[o.currency]||0) + (o.total||0); });
    var sumStr = Object.keys(sumTotal).map(function(c){ return (symMap[c]||c) + ' ' + sumTotal[c].toFixed(2); }).join(' · ') || '–';

    var h = '<div class="month-orders-card">';
    h += '<div class="month-orders-header">';
    var syncStr = '';
    if (_monthOrdersLastSync) {
        var sd = new Date(_monthOrdersLastSync);
        if (!isNaN(sd.getTime())) syncStr = ' · sync ' + String(sd.getHours()).padStart(2,'0') + ':' + String(sd.getMinutes()).padStart(2,'0');
    }
    h += '<div class="month-orders-title"><i class="fas fa-list"></i> Vsi orderji v izbranem obdobju <span class="month-orders-meta">(' + rows.length + ' / ' + _monthOrdersData.length + ' · ' + sumStr + syncStr + ')</span></div>';
    h += '<div style="display:flex;gap:8px;align-items:center;">';
    h += '<input class="month-orders-search" type="text" placeholder="Filter: kupec, produkt, agent, drzava, # order" oninput="renderMonthOrders(this.value)" value="' + (filter||'').replace(/"/g,'&quot;') + '">';
    h += '<button onclick="forceSyncMonthOrders(this)" style="padding:6px 10px;background:#10B981;color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;" title="Sync WooCommerce v ozadju"><i class="fas fa-sync"></i> Sync</button>';
    h += '</div>';
    h += '</div>';
    h += '<div>';
    h += '<table class="month-orders-tbl"><thead><tr>';
    h += '<th>Datum</th><th>Drzava</th><th>#</th><th>Kupec</th><th>Znesek</th><th>Produkti</th><th>Agent</th>';
    h += '</tr></thead><tbody>';
    if (rows.length === 0) {
        h += '<tr><td colspan="7" style="text-align:center;color:#9CA3AF;padding:24px;">Ni orderjev v tem obdobju</td></tr>';
    } else {
        rows.forEach(function(o){
            var dt = new Date(o.date);
            var dStr = isNaN(dt.getTime()) ? (o.date||'-') : (String(dt.getDate()).padStart(2,'0') + '.' + String(dt.getMonth()+1).padStart(2,'0') + '. ' + String(dt.getHours()).padStart(2,'0') + ':' + String(dt.getMinutes()).padStart(2,'0'));
            var sym = symMap[o.currency] || (o.currency||'');
            h += '<tr>';
            h += '<td class="mo-date">' + dStr + '</td>';
            h += '<td>' + (o.storeFlag||'') + ' ' + (o.storeCode||'').toUpperCase() + '</td>';
            h += '<td class="mo-orderid">#' + (o.number||o.id||'-') + '</td>';
            h += '<td>' + escapeHtml(o.customer||'-') + (o.phone ? '<div style="font-size:10px;color:#9CA3AF;">' + escapeHtml(o.phone) + '</div>' : '') + '</td>';
            h += '<td class="mo-total">' + sym + ' ' + (o.total||0).toFixed(2) + '</td>';
            h += '<td class="mo-products" title="' + escapeHtml(o.products||'') + '">' + escapeHtml((o.products||'').length > 90 ? o.products.slice(0,88)+'…' : (o.products||'-')) + '</td>';
            h += '<td class="mo-agent">' + escapeHtml(o.agent||'-') + '</td>';
            h += '</tr>';
        });
    }
    h += '</tbody></table></div></div>';
    document.getElementById('monthOrdersWrap').innerHTML = h;
}

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
}

loadStats();
</script>
